name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Run pre-commit hooks
        run: uv run --locked --only-group dev pre-commit run --all-files

  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: astral-sh/setup-uv@v7

      - name: Test regular installation
        run: |
          uv sync --locked --no-dev --no-editable --python "${{ matrix.python-version }}"
          uv run --no-sync python -c "import hxntools; print(f'✓ hxntools imported successfully (regular): {hxntools.__file__}')"
          uv run --no-sync python -c "from importlib.metadata import version; print(f'✓ Version: {version(\"hxntools\")}')"

      - name: Test editable installation
        run: |
          uv sync --locked --no-dev --python "${{ matrix.python-version }}"
          uv run --no-sync python -c "import hxntools; print(f'✓ hxntools imported successfully (editable): {hxntools.__file__}')"
          uv run --no-sync python -c "from importlib.metadata import version; print(f'✓ Version: {version(\"hxntools\")} (editable)')"

      - name: Test package modules import
        run: |
          uv run --no-sync python -c "
          import hxntools
          import pkgutil
          modules = [name for _, name, _ in pkgutil.iter_modules(hxntools.__path__, hxntools.__name__ + '.')]
          print(f'✓ Found {len(modules)} submodules')
          for module in modules[:3]:  # Test first few modules
              try:
                  __import__(module)
                  print(f'✓ {module} imported successfully')
              except ImportError as e:
                  print(f'⚠ {module} import failed: {e}')
          "

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7

      - name: Run test suite
        run: |
          uv sync --locked --group dev --python "${{ matrix.python-version }}"
          uv run --no-sync pytest tests -v
