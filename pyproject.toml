[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hxntools"
dynamic = ["version"]
description = "NSLS-II Hard X-ray Nanoprobe data acquisition tools"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
    {name = "Brookhaven National Laboratory", email = "DAMA@bnl.gov"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "bluesky>=1.15.1,<2",
    "boltons",
    "cycler",
    "databroker>=2.0.2,<3",
    "h5py",
    "matplotlib",
    "nslsii>=0.11.9,<0.12",
    "numpy",
    "ophyd>=1.11.2,<2",
    "ophyd-async[ca,pva]>=0.21.3,<0.22",
    "pandas",
    "pyepics",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/NSLS-II-HXN/hxntools"
"Bug Tracker" = "https://github.com/NSLS-II-HXN/hxntools/issues"
Discussions = "https://github.com/NSLS-II-HXN/hxntools/discussions"
Changelog = "https://github.com/NSLS-II-HXN/hxntools/releases"

[dependency-groups]
dev = [
    "pre-commit>=4.3",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/hxntools"]

[tool.hatch.build.hooks.vcs]
version-file = "src/hxntools/_version.py"

[tool.ruff]
target-version = "py311"
extend-exclude = ["src"]

[tool.ruff.lint]
select = ["F"]
